<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RimWorld — все команды и цены</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #1e1e2f;
      color: #e0e0e0;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-weight: 300;
      letter-spacing: 1px;
    }
    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      background: #2a2a3e;
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 25px;
      align-items: center;
      justify-content: space-between;
    }
    .filters input, .filters select {
      background: #3a3a52;
      border: 1px solid #555;
      color: #eee;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      min-width: 180px;
    }
    .filters input::placeholder {
      color: #888;
    }
    .filters select {
      cursor: pointer;
    }
    .filters label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
    }
    .stats {
      font-size: 0.9rem;
      color: #aaa;
      margin-left: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #252538;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    th {
      background: #33334a;
      color: #c8c8e8;
      font-weight: 600;
      padding: 12px 10px;
      text-align: left;
      cursor: pointer;
      user-select: none;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 2px solid #4a4a6a;
    }
    th:hover {
      background: #3d3d5a;
    }
    td {
      padding: 10px 10px;
      border-bottom: 1px solid #3a3a52;
      vertical-align: middle;
    }
    tr:hover td {
      background: #2e2e48;
    }
    .karma-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .karma-Good { background: #2d7d3a; color: #c8f0c0; }
    .karma-Bad { background: #b85a2a; color: #f5d0b0; }
    .karma-Doom { background: #a03131; color: #fcc; }
    .karma-Neutral { background: #4a4a6a; color: #ccc; }
    .enabled-true { color: #7bc97b; font-weight: 600; }
    .enabled-false { color: #b0b0b0; }
    .category-badge {
      background: #3a3a5a;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      display: inline-block;
      white-space: nowrap;
    }
    .mod-source {
      font-size: 0.8rem;
      color: #aaa;
    }
    .price {
      font-weight: 600;
      color: #f0e68c;
    }
    .table-wrapper {
      overflow-x: auto;
      max-height: 75vh;
      border-radius: 10px;
      background: #1e1e30;
    }
    .loading {
      text-align: center;
      padding: 50px;
      font-size: 1.2rem;
      color: #aaa;
    }
    .no-results {
      text-align: center;
      padding: 30px;
      color: #aaa;
    }
    @media (max-width: 768px) {
      .filters {
        flex-direction: column;
        align-items: stretch;
      }
      .filters input, .filters select {
        min-width: unset;
        width: 100%;
      }
      .stats {
        margin-left: 0;
        text-align: center;
      }
      th, td {
        padding: 8px 6px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🎮 RimWorld · Команды и события</h1>
  <p class="subtitle">Интерактивный справочник всех доступных инцидентов для вашего режима дуэли</p>

  <div class="filters">
    <input type="text" id="searchInput" placeholder="🔍 Поиск по названию, категории..." />
    <select id="karmaFilter">
      <option value="all">Все типы кармы</option>
      <option value="Good">✅ Good</option>
      <option value="Neutral">⚪ Neutral</option>
      <option value="Bad">⚠️ Bad</option>
      <option value="Doom">💀 Doom</option>
    </select>
    <select id="enabledFilter">
      <option value="all">Все статусы</option>
      <option value="true">✅ Включено</option>
      <option value="false">❌ Отключено</option>
    </select>
    <label>
      <input type="checkbox" id="showOnlyRaids" /> Только рейды
    </label>
    <span class="stats" id="stats">Загрузка...</span>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th data-sort="label">Название</th>
          <th data-sort="baseCost" style="text-align:right;">Цена</th>
          <th data-sort="karmaType">Карма</th>
          <th data-sort="categoryName">Категория</th>
          <th data-sort="modSource">Источник</th>
          <th data-sort="enabled">Статус</th>
          <th data-sort="isRaid">Рейд</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="7" class="loading">⏳ Загрузка данных...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  (function() {
    // --- данные ---
    let incidents = [];
    let filteredIncidents = [];
    const tbody = document.getElementById('tableBody');
    const statsSpan = document.getElementById('stats');

    // --- загрузка JSON ---
    async function loadData() {
      try {
        const response = await fetch('incidents.json');
        if (!response.ok) throw new Error('Не удалось загрузить incidents.json');
        const data = await response.json();
        // data — это объект, ключи — DefName
        incidents = Object.values(data).map(item => ({
          ...item,
          // добавляем удобные булевы поля для фильтров
          isRaid: item.IsRaidIncident || false,
          isEnabled: item.Enabled || false,
        }));
        filteredIncidents = [...incidents];
        renderTable();
        updateStats();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" style="color:#f77;">❌ Ошибка загрузки: ${err.message}</td></tr>`;
        statsSpan.textContent = 'Ошибка';
        console.error(err);
      }
    }

    // --- рендеринг ---
    function renderTable() {
      if (filteredIncidents.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="no-results">😕 Ничего не найдено</td></tr>`;
        return;
      }
      let html = '';
      filteredIncidents.forEach(inc => {
        const karmaClass = `karma-${inc.KarmaType || 'Neutral'}`;
        const enabledClass = inc.Enabled ? 'enabled-true' : 'enabled-false';
        const enabledText = inc.Enabled ? '✅ Да' : '❌ Нет';
        const raidIcon = inc.IsRaidIncident ? '⚔️' : '—';
        html += `<tr>
          <td><strong>${inc.Label || inc.DefName}</strong></td>
          <td style="text-align:right;"><span class="price">${inc.BaseCost ?? 0}</span></td>
          <td><span class="karma-badge ${karmaClass}">${inc.KarmaType || 'Neutral'}</span></td>
          <td><span class="category-badge">${inc.CategoryName || '—'}</span></td>
          <td class="mod-source">${inc.ModSource || 'Core'}</td>
          <td class="${enabledClass}">${enabledText}</td>
          <td>${raidIcon}</td>
        </tr>`;
      });
      tbody.innerHTML = html;
    }

    function updateStats() {
      statsSpan.textContent = `📊 ${filteredIncidents.length} из ${incidents.length} событий`;
    }

    // --- фильтры ---
    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const karma = document.getElementById('karmaFilter').value;
      const enabled = document.getElementById('enabledFilter').value;
      const onlyRaids = document.getElementById('showOnlyRaids').checked;

      filteredIncidents = incidents.filter(inc => {
        // поиск
        if (search) {
          const label = (inc.Label || '').toLowerCase();
          const def = (inc.DefName || '').toLowerCase();
          const cat = (inc.CategoryName || '').toLowerCase();
          const mod = (inc.ModSource || '').toLowerCase();
          if (!label.includes(search) && !def.includes(search) && !cat.includes(search) && !mod.includes(search)) {
            return false;
          }
        }
        // карма
        if (karma !== 'all' && inc.KarmaType !== karma) return false;
        // статус включения
        if (enabled !== 'all') {
          const isEnabled = inc.Enabled || false;
          if (enabled === 'true' && !isEnabled) return false;
          if (enabled === 'false' && isEnabled) return false;
        }
        // только рейды
        if (onlyRaids && !inc.IsRaidIncident) return false;
        return true;
      });

      renderTable();
      updateStats();
    }

    // --- сортировка по заголовкам ---
    let sortKey = 'label';
    let sortAsc = true;

    function sortTable(key) {
      if (sortKey === key) {
        sortAsc = !sortAsc;
      } else {
        sortKey = key;
        sortAsc = true;
      }
      filteredIncidents.sort((a, b) => {
        let valA = a[key] ?? '';
        let valB = b[key] ?? '';
        if (typeof valA === 'string') valA = valA.toLowerCase();
        if (typeof valB === 'string') valB = valB.toLowerCase();
        if (valA < valB) return sortAsc ? -1 : 1;
        if (valA > valB) return sortAsc ? 1 : -1;
        return 0;
      });
      renderTable();
    }

    // --- обработчики событий ---
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('karmaFilter').addEventListener('change', applyFilters);
    document.getElementById('enabledFilter').addEventListener('change', applyFilters);
    document.getElementById('showOnlyRaids').addEventListener('change', applyFilters);

    document.querySelectorAll('th[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        sortTable(key);
      });
    });

    // --- старт ---
    loadData();
  })();
</script>
</body>
</html>
